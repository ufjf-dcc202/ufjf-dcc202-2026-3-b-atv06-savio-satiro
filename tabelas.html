<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>DCC202 Tabelas</h1>

    <table border="1" style="border-color: black; width: 300px; height: 150px; text-align: center;"> 
        <caption style="font-weight: bolder;">Lista com 3 Pokemãos   </caption>
        <thead>
            <tr>
                <th>Pokemão</th>
                <th>CP</th>
                <th>SP</th>
                <th>HP</th>
                <th>SD</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Chachapu</td>
                <td>25</td>
                <td>30</td>
                <td>50</td>
                <td>60</td>
            </tr>

            <tr>
                <td>Charamando</td>
                <td>50</td>
                <td>10</td>
                <td>80</td>
                <td>30</td>
            </tr>

            <tr>
                <td>Bulbudado</td>
                <td>30</td>
                <td>20</td>
                <td>100</td>
                <td>10</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
